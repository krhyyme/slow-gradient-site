# Builds the site and deploys it to Cloudflare Pages:
#   - push to main  -> production (slowgradient.com)
#   - pull request  -> preview at <branch>.slow-gradient.pages.dev
#
# Requires repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write  # lets wrangler report deployments back to GitHub

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with your local versions (`hugo version`, `sass --version`).
  HUGO_VERSION: 0.170.1
  DART_SASS_VERSION: 1.108.2
  CLOUDFLARE_PROJECT: slow-gradient

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Hugo
        run: |
          curl -fsSLo "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Install Dart Sass
        run: |
          curl -fsSL \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          sass --version
          hugo --gc --minify

      # Skipped until the Cloudflare secrets exist, so PRs still get a build check.
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy public
            --project-name=${{ env.CLOUDFLARE_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
