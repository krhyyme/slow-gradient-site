# Builds the site on every PR (as a check) and deploys main to GitHub Pages.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with your local versions (`hugo version`, `sass --version`).
  HUGO_VERSION: 0.170.1
  DART_SASS_VERSION: 1.108.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Hugo
        run: |
          curl -fsSLo "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Install Dart Sass
        run: |
          curl -fsSL \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          sass --version
          hugo --gc --minify

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
